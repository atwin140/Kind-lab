apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: css
          mountPath: /usr/share/nginx/html/style.css
          subPath: style.css
      volumes:
      - name: html
        configMap:
          name: nginx-html
      - name: css
        configMap:
          name: nginx-css
