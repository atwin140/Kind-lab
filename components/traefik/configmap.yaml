apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-html
  namespace: traefik
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Traefik Air Traffic Control</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: white;
                overflow: hidden;
            }
            
            .sky {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
                z-index: -1;
            }
            
            .clouds {
                position: absolute;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            
            .cloud {
                position: absolute;
                background: white;
                border-radius: 100px;
                opacity: 0.8;
                animation: float 20s infinite linear;
            }
            
            .cloud:before, .cloud:after {
                content: '';
                position: absolute;
                background: white;
                border-radius: 100px;
            }
            
            .cloud1 { width: 80px; height: 30px; top: 10%; left: -80px; animation-delay: 0s; }
            .cloud2 { width: 100px; height: 40px; top: 30%; left: -100px; animation-delay: 5s; }
            .cloud3 { width: 70px; height: 25px; top: 50%; left: -70px; animation-delay: 10s; }
            
            @keyframes float {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(100vw + 200px)); }
            }
            
            .container {
                text-align: center;
                z-index: 10;
                padding: 2rem;
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                max-width: 800px;
            }
            
            .tower {
                font-size: 4rem;
                margin-bottom: 1rem;
                animation: pulse 2s infinite;
            }
            
            @keyframes pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.05); }
            }
            
            h1 {
                font-size: 2.5rem;
                margin-bottom: 1rem;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            }
            
            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 2rem;
                opacity: 0.9;
            }
            
            .plane-container {
                position: relative;
                height: 200px;
                margin: 2rem 0;
            }
            
            .plane {
                font-size: 3rem;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                animation: fly 4s infinite ease-in-out;
                filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            }
            
            @keyframes fly {
                0%, 100% { 
                    transform: translate(-50%, -50%) rotate(-10deg);
                }
                50% { 
                    transform: translate(-30%, -60%) rotate(5deg);
                }
            }
            
            .signal {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #4ade80;
                transform: translate(-50%, -50%);
                animation: signal 2s infinite;
            }
            
            @keyframes signal {
                0% {
                    box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
                }
                100% {
                    box-shadow: 0 0 0 30px rgba(74, 222, 128, 0);
                }
            }
            
            .info-box {
                background: rgba(255, 255, 255, 0.2);
                padding: 1.5rem;
                border-radius: 10px;
                margin: 1rem 0;
                text-align: left;
            }
            
            .info-box h3 {
                margin-bottom: 0.5rem;
                color: #fbbf24;
            }
            
            .info-box ul {
                list-style: none;
                padding-left: 0;
            }
            
            .info-box li {
                padding: 0.3rem 0;
                padding-left: 1.5rem;
                position: relative;
            }
            
            .info-box li:before {
                content: '✈️';
                position: absolute;
                left: 0;
            }
            
            .route {
                display: inline-block;
                background: rgba(255, 255, 255, 0.3);
                padding: 0.5rem 1rem;
                border-radius: 20px;
                margin: 0.5rem;
                font-weight: bold;
            }
            
            .status {
                margin-top: 2rem;
                font-size: 1.1rem;
                color: #4ade80;
                font-weight: bold;
                animation: blink 2s infinite;
            }
            
            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }
            
            .footer {
                margin-top: 2rem;
                font-size: 0.9rem;
                opacity: 0.8;
            }
            
            a {
                color: #fbbf24;
                text-decoration: none;
                font-weight: bold;
            }
            
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="sky">
            <div class="clouds">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
            </div>
        </div>
        
        <div class="container">
            <div class="tower">🗼</div>
            <h1>Traefik Air Traffic Control</h1>
            <p class="subtitle">Your Kubernetes Ingress Controller is Live!</p>
            
            <div class="plane-container">
                <div class="signal"></div>
                <div class="plane">✈️</div>
            </div>
            
            <div class="info-box">
                <h3>🎯 Traffic Director Online</h3>
                <ul>
                    <li>Monitoring all incoming requests</li>
                    <li>Routing traffic to backend services</li>
                    <li>Load balancing across pods</li>
                    <li>Dynamic configuration updates</li>
                </ul>
            </div>
            
            <div class="info-box">
                <h3>🛫 Active Flight Paths</h3>
                <p style="margin-top: 0.5rem;">Traefik is directing traffic based on:</p>
                <div style="margin-top: 1rem;">
                    <span class="route">📍 Hostname Routing</span>
                    <span class="route">🛣️ Path-Based Routing</span>
                    <span class="route">🔀 Load Balancing</span>
                </div>
            </div>
            
            <p class="status">✅ ALL SYSTEMS OPERATIONAL</p>
            
            <div class="footer">
                <p>🎛️ Access Dashboard: <a href="/dashboard/">Traefik Dashboard</a></p>
                <p>📦 Deployed via FluxCD GitOps</p>
                <p style="margin-top: 1rem;">
                    <strong>Traefik</strong> - The Cloud Native Application Proxy<br>
                    Making microservices networking simple, fast, and reliable.
                </p>
            </div>
        </div>
    </body>
    </html>
