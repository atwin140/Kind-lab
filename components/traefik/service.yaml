apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
  - name: web
    port: 80
    targetPort: web
    nodePort: 30090
    protocol: TCP
  - name: traefik
    port: 8080
    targetPort: traefik
    protocol: TCP
