apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: LoadBalancer
  # Uncomment to request specific VIP from KubeVIP
  # loadBalancerIP: 192.168.1.240
  selector:
    app.kubernetes.io/name: traefik
  ports:
  - name: web
    port: 80
    targetPort: web
    protocol: TCP
  - name: traefik
    port: 8080
    targetPort: traefik
    protocol: TCP
