kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fluxcd-test
# ─── Second network (Multus + macvlan) on RHEL 10 / Podman ──────────────────
# Kind requires rootful Podman on RHEL for macvlan to work.
# Run all three steps to get pods onto the 10.0.1.x LAN:
#
#   sudo ./setup-macvlan.sh create-network
#   sudo KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --config kind-cluster.yaml
#   sudo ./setup-macvlan.sh attach-nodes
#
# Then Multus (deployed by FluxCD) installs the NetworkAttachmentDefinition
# "local-network" in the default namespace.  Annotate any pod with:
#   k8s.v1.cni.cncf.io/networks: local-network
# to give it a second NIC with an IP in 10.0.1.200-10.0.1.250.
#
# SELinux: if pods fail to start, run:
#   sudo setsebool -P container_manage_cgroup on
# ─────────────────────────────────────────────────────────────────────────────
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    listenAddress: "127.0.0.1"
    protocol: TCP
  - containerPort: 30081
    hostPort: 30081
    listenAddress: "127.0.0.1"
    protocol: TCP
  - containerPort: 30090
    hostPort: 30090
    listenAddress: "127.0.0.1"
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443
    listenAddress: "127.0.0.1"
    protocol: TCP
